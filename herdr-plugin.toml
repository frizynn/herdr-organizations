id = "herdr-projects"
name = "Organizations"
version = "0.3.0"
min_herdr_version = "0.9.1"
description = "A project as a tree: one coordinator, leads by area and workers, with scoped instructions, quiet batched updates and a navigable view of what needs you."
platforms = ["macos", "linux"]

[[build]]
# Downloads the release binary; falls back to `cargo build --release --locked`.
command = ["sh", "scripts/install.sh"]

[[startup]]
command = ["target/release/herdr-projects", "startup"]

[[actions]]
id = "new"
title = "Organizations: new project"
contexts = ["workspace"]
command = ["target/release/herdr-projects", "action", "new"]

[[actions]]
id = "open"
title = "Organizations: open project"
contexts = ["workspace"]
command = ["target/release/herdr-projects", "action", "open"]

[[actions]]
id = "open-popup"
title = "Organizations"
contexts = ["global", "workspace"]
command = ["target/release/herdr-projects", "action", "open-popup"]

[[actions]]
id = "organization-sidebar"
title = "Organizations: toggle the project tree"
description = "Toggle the docked tree of the current project: coordinator, leads and workers with their state, what needs you and pull requests."
contexts = ["workspace"]
command = ["target/release/herdr-projects", "action", "organization-sidebar"]

[[actions]]
id = "focus"
title = "Organizations: focus sidebar on this project"
contexts = ["workspace"]
command = ["target/release/herdr-projects", "action", "focus"]

[[actions]]
id = "unfocus"
title = "Organizations: clear sidebar focus"
contexts = ["workspace"]
command = ["target/release/herdr-projects", "action", "unfocus"]

[[actions]]
id = "adopt-workspace"
title = "Organizations: continue this workspace as a project"
contexts = ["workspace"]
command = ["target/release/herdr-projects", "action", "adopt-workspace"]

[[actions]]
id = "pause"
title = "Organizations: pause project"
contexts = ["workspace"]
command = ["target/release/herdr-projects", "action", "pause"]

[[actions]]
id = "resume"
title = "Organizations: resume project"
contexts = ["workspace"]
command = ["target/release/herdr-projects", "action", "resume"]

[[actions]]
id = "configure"
title = "Organizations: set up the sidebar, popup key, progress hooks and skill"
contexts = ["workspace"]
command = ["target/release/herdr-projects", "action", "configure"]

[[actions]]
id = "doctor"
title = "Organizations: check setup"
contexts = ["workspace"]
command = ["target/release/herdr-projects", "action", "doctor"]

[[panes]]
id = "projects"
title = "Projects"
placement = "popup"
width = "80%"
height = "80%"
command = ["target/release/herdr-projects", "pane", "projects"]

[[panes]]
id = "new"
title = "New project"
placement = "popup"
command = ["target/release/herdr-projects", "pane", "new"]

[[panes]]
id = "pick"
title = "Pick a project"
placement = "popup"
command = ["target/release/herdr-projects", "pane", "pick"]

[[panes]]
id = "adopt"
title = "Continue as a project"
placement = "popup"
command = ["target/release/herdr-projects", "pane", "adopt"]

[[events]]
on = "tab.focused"
command = ["target/release/herdr-projects", "action", "organization-sidebar-auto-open"]

[[events]]
on = "workspace.created"
command = ["target/release/herdr-projects", "action", "organization-sidebar-auto-open"]
