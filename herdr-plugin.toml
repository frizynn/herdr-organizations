id = "herdr-projects"
name = "Herdr Organizations"
version = "0.1.0"
min_herdr_version = "0.9.1"
description = "Recursive coordinator and worker organizations with scoped instructions, agent profiles and a navigable tree."
platforms = ["macos", "linux"]

[[build]]
command = ["cargo", "build", "--release", "--locked"]

[[startup]]
command = ["target/release/herdr-organizations", "ticker", "start"]

[[actions]]
id = "new"
title = "Herdr Organizations: new project"
contexts = ["workspace"]
command = ["target/release/herdr-organizations", "action", "new"]

[[actions]]
id = "open"
title = "Herdr Organizations: open project"
contexts = ["workspace"]
command = ["target/release/herdr-organizations", "action", "open"]

[[actions]]
id = "overview"
title = "Herdr Organizations: overview"
contexts = ["workspace"]
command = ["target/release/herdr-organizations", "action", "overview"]

[[actions]]
id = "organizations"
title = "Herdr Organizations: organization tree"
contexts = ["workspace"]
command = ["target/release/herdr-organizations", "action", "organizations"]

[[actions]]
id = "focus"
title = "Herdr Organizations: focus sidebar on this project"
contexts = ["workspace"]
command = ["target/release/herdr-organizations", "action", "focus"]

[[actions]]
id = "unfocus"
title = "Herdr Organizations: clear sidebar focus"
contexts = ["workspace"]
command = ["target/release/herdr-organizations", "action", "unfocus"]

[[actions]]
id = "adopt-workspace"
title = "Herdr Organizations: continue this workspace as a project"
contexts = ["workspace"]
command = ["target/release/herdr-organizations", "action", "adopt-workspace"]

[[actions]]
id = "pause"
title = "Herdr Organizations: pause project"
contexts = ["workspace"]
command = ["target/release/herdr-organizations", "action", "pause"]

[[actions]]
id = "resume"
title = "Herdr Organizations: resume project"
contexts = ["workspace"]
command = ["target/release/herdr-organizations", "action", "resume"]

[[actions]]
id = "doctor"
title = "Herdr Organizations: check setup"
contexts = ["workspace"]
command = ["target/release/herdr-organizations", "action", "doctor"]

[[panes]]
id = "overview"
title = "Project overview"
placement = "popup"
command = ["target/release/herdr-organizations", "pane", "overview"]

[[panes]]
id = "new"
title = "New project"
placement = "popup"
command = ["target/release/herdr-organizations", "pane", "new"]

[[panes]]
id = "pick"
title = "Pick a project"
placement = "popup"
command = ["target/release/herdr-organizations", "pane", "pick"]

[[panes]]
id = "adopt"
title = "Continue as a project"
placement = "popup"
command = ["target/release/herdr-organizations", "pane", "adopt"]

[[panes]]
id = "organizations"
title = "Herdr Organizations"
placement = "popup"
command = ["target/release/herdr-organizations", "pane", "organizations"]
