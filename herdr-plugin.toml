id = "herdr-projects"
name = "Herdr Organizations"
version = "0.1.0"
min_herdr_version = "0.9.1"
description = "Recursive coordinator and worker organizations with scoped instructions, agent profiles and a navigable tree."
platforms = ["macos", "linux"]

[[build]]
command = ["cargo", "build", "--release", "--locked"]

[[startup]]
command = ["target/release/herdr-organizations", "ticker", "start"]

[[actions]]
id = "organizations"
title = "Herdr Organizations: launcher"
description = "Needs-you across every coordinator, projects with their coordinators, board and settings in one popup."
contexts = ["global", "workspace"]
command = ["target/release/herdr-organizations", "action", "organizations"]

[[actions]]
id = "new"
title = "Herdr Organizations: new project, coordinator, thread or workspace"
contexts = ["workspace"]
command = ["target/release/herdr-organizations", "action", "new"]

[[actions]]
id = "open"
title = "Herdr Organizations: open project"
contexts = ["workspace"]
command = ["target/release/herdr-organizations", "action", "open"]

[[actions]]
id = "overview"
title = "Herdr Organizations: project tree"
contexts = ["workspace"]
command = ["target/release/herdr-organizations", "action", "overview"]

[[actions]]
id = "organization-sidebar"
title = "Herdr Organizations: toggle dock"
description = "Toggle the optional dock split for this workspace's coordinator. It reads the ticker's state file and never polls Herdr."
contexts = ["workspace"]
command = ["target/release/herdr-organizations", "action", "organization-sidebar"]

[[actions]]
id = "focus"
title = "Herdr Organizations: focus sidebar on this project"
contexts = ["workspace"]
command = ["target/release/herdr-organizations", "action", "focus"]

[[actions]]
id = "unfocus"
title = "Herdr Organizations: clear sidebar focus"
contexts = ["workspace"]
command = ["target/release/herdr-organizations", "action", "unfocus"]

[[actions]]
id = "adopt-workspace"
title = "Herdr Organizations: continue this workspace as a project"
contexts = ["workspace"]
command = ["target/release/herdr-organizations", "action", "adopt-workspace"]

[[actions]]
id = "pause"
title = "Herdr Organizations: pause project"
contexts = ["workspace"]
command = ["target/release/herdr-organizations", "action", "pause"]

[[actions]]
id = "resume"
title = "Herdr Organizations: resume project"
contexts = ["workspace"]
command = ["target/release/herdr-organizations", "action", "resume"]

[[actions]]
id = "doctor"
title = "Herdr Organizations: check setup"
contexts = ["workspace"]
command = ["target/release/herdr-organizations", "action", "doctor"]

[[panes]]
id = "ui"
title = "Organizations"
placement = "popup"
width = 92
height = 31
command = ["target/release/herdr-organizations", "pane", "ui"]
