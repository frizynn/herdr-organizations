[package]
name = "herdr-organizations"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Recursive organizations for herdr with scoped instructions, agent profiles and a terminal tree"
autobins = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
jiff = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.9"
crossterm = "0.29"
libc = "0.2"
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "herdr-organizations"
path = "src/main.rs"

[[bin]]
name = "herdr-projects"
path = "src/legacy_main.rs"
test = false
bench = false
