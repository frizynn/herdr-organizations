[package]
name = "herdr-projects"
version = "0.3.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Herdr Organizations: a coordinator, leads by area and workers, with scoped instructions and a navigable tree"
autobins = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.29", default-features = false, features = ["events"] }
jiff = "0.2"
jsonc-parser = { version = "0.33", features = ["cst", "serde_json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.9"
libc = "0.2"
toml_edit = "0.23"
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "herdr-projects"
path = "src/main.rs"
